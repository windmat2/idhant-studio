<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certificates | Idhant's Studio</title>

  <style>
    :root {
      --bg-color: #2e3a59;
      --text-color: white;
      --hover-color: #a3c4f3;
      --white: #fff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-image: url("background.jpg");
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      color: #333;
    }

    header {
      background-color: #1d2640;
      color: white;
      text-align: center;
      padding: 1.5em;
    }

    /* Navigation */
     nav {
      background-color: var(--bg-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1em 2em;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .menu-logo {
      font-size: 1.5em;
      color: var(--text-color);
      font-weight: bold;
    }

    .menu-toggle {
      font-size: 1.6em;
      color: var(--text-color);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .menu-toggle.open {
      transform: rotate(90deg);
    }

    .menu-links {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: rgba(29, 38, 64, 0.6);
      backdrop-filter: blur(10px);
      overflow: hidden;
      max-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 2em;
      transition: max-height 0.4s ease, padding 0.3s ease;
    }

    .menu-links.open {
      max-height: 400px;
      padding: 1em 2em;
    }

    .menu-links a {
      font-family: 'Playfair Display', serif;
      color: var(--text-color);
      text-decoration: none;
      padding: 0.6em 0;
      font-weight: 500;
      font-size: 1.1em;
      position: relative;
    }

    .menu-links a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      background-color: var(--hover-color);
      bottom: -4px;
      left: 0;
      transition: width 0.3s ease;
    }

    .menu-links a:hover::after {
      width: 100%;
    }

    .has-submenu {
      position: relative;
    }

    .submenu {
      list-style: none;
      padding-left: 1em;
      margin: 0.3em 0 0.6em 0;
      display: none;
      flex-direction: column;
    }

    .submenu a {
      font-size: 0.95em;
      padding: 0.4em 0;
      color: var(--hover-color);
    }

    .has-submenu.open .submenu {
      display: flex;
    }

    /* Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
      padding: 2em;
      max-width: 1200px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 20px;
      box-shadow: -7px 10px 17px rgba(0,0,0,0.75);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      animation: fadeIn 0.3s ease;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255,255,255,0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    footer {
      text-align: center;
      background-color: #1d2640;
      color: white;
      padding: 1.2em;
      margin-top: 2em;
    }
  </style>
</head>

<body>

  <header>
    <h1>Certificates</h1>
    <p>Achievements & Milestones</p>
  </header>

  <nav>
    <div class="menu-toggle" id="toggleBtn" onclick="toggleMenu()">☰</div>
    <div class="menu-links" id="menu">
      <a href="index.html" onclick="closeMenu()">Home</a>

      <div class="has-submenu" onclick="toggleSubmenu(this)">
        <a href="#music">Photos ▾</a>
        <div class="submenu">
          <a href="photogallery.html" onclick="closeMenu()">Certificates</a>
          <a href="#jazz" onclick="closeMenu()">Extracurriculars</a>
          <a href="#originals" onclick="closeMenu()">Me</a>
        </div>
      </div>

      <a href="#gallery" onclick="closeMenu()">My Music</a>
      <a href="resume.html" onclick="closeMenu()">Resume</a>
      <a href="contact.html" onclick="closeMenu()">Contact</a>
    </div>
  </nav>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("menu");
      const toggleBtn = document.getElementById("toggleBtn");
      menu.classList.toggle("open");
      toggleBtn.classList.toggle("open");
      toggleBtn.textContent = menu.classList.contains("open") ? "✖" : "☰";
    }

    function closeMenu() {
      const menu = document.getElementById("menu");
      const toggleBtn = document.getElementById("toggleBtn");
      menu.classList.remove("open");
      toggleBtn.classList.remove("open");
      toggleBtn.textContent = "☰";
      document.querySelectorAll(".has-submenu").forEach(el => el.classList.remove("open"));
    }

    function toggleSubmenu(element) {
      element.classList.toggle("open");
    }
  </script>

  <!-- Gallery -->
  <div class="gallery">
    <img src="certificates/Tabla.png" alt="Certificate 5" onclick="openLightbox(this.src)">
  </div>

   <div class="gallery">
    <img src="certificates/IMG_1584.jpg" alt="Certificate 5" onclick="openLightbox(this.src)">
  </div>

   <div class="gallery">
    <img src="certificates/IMG_1585.jpg" alt="Certificate 5" onclick="openLightbox(this.src)">
  </div>

   <div class="gallery">
    <img src="certificates/IMG_1586.jpg" alt="Certificate 5" onclick="openLightbox(this.src)">
  </div>

   <div class="gallery">
    <img src="certificates/IMG_1587.jpg" alt="Certificate 5" onclick="openLightbox(this.src)">
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="">
  </div>

  <script>
    function openLightbox(src) {
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox").style.display = "flex";
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }
  </script>

  <footer>
    <p>© 2025 Idhant's Studio. All certificates © Idhant Shenvi Kuvelkar</p>
  </footer>

</body>
</html>
